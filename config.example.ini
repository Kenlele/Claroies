[LineBot]
# LINE Messaging API 權杖與密鑰
CHANNEL_ACCESS_TOKEN = YOUR_LINE_CHANNEL_ACCESS_TOKEN
CHANNEL_SECRET = YOUR_LINE_CHANNEL_SECRET

[Flask]
# 伺服器綁定主機與埠號
HOST = 0.0.0.0
PORT = 5000
SECRET_KEY = your-flask-secret-key-change-this

[Gemini]
# Google Gemini API 金鑰
API_KEY = YOUR_GEMINI_API_KEY
MODEL = gemini-1.5-flash-latest

[GoogleVision]
# Google Cloud Service Account 金鑰檔案路徑 (選填)
CREDENTIALS_PATH = credentials.json

[AzureOpenAI]
# Azure OpenAI API 資訊 (選填/食物與運動進階分析)
API_KEY = YOUR_AZURE_OPENAI_API_KEY
API_BASE = https://your-resource-name.openai.azure.com/
API_VERSION = 2024-07-01-preview
DEPLOYMENT_NAME_GPT4o = gpt-4o

[AzureOpenAI_Embedding]
API_KEY = YOUR_AZURE_EMBEDDING_API_KEY
API_BASE = https://your-resource-name.openai.azure.com/
API_VERSION = 2024-07-01-preview
DEPLOYMENT_NAME_TEXT_EMBEDDING_ADA_002 = text-embedding-ada-002

[ngrok]
# 外部公開網址 (例如 ngrok URL 或雲端部署網址，用於圖片展示與回呼)
website_url = https://your-domain.ngrok-free.app

[Edamam]
APP_ID = YOUR_EDAMAM_APP_ID
APP_KEY = YOUR_EDAMAM_APP_KEY

[STRAVA]
CLIENT_ID = YOUR_STRAVA_CLIENT_ID
CLIENT_SECRET = YOUR_STRAVA_CLIENT_SECRET
